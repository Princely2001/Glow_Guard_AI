name: glowguard_app
description: "GlowGuard AI – Chemical Safety Scanner"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.1
  firebase_storage: ^12.3.2
  firebase_messaging: 15.2.10

  # UI & Utils
  cupertino_icons: ^1.0.8
  intl: ^0.18.1

  # NEW: Added for internal document viewing
  webview_flutter: ^4.4.2

  url_launcher: ^6.3.0
  image_picker: ^1.0.4
  file_picker: ^8.0.6

  # ML
  image: ^4.1.7
  tflite_flutter: ^0.12.1
  firebase_app_check: ^0.3.2+10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ml/glowguard_efficientnet.tflite
    - assets/ml/labels.txt